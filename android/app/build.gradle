plugins {
    id 'com.android.application'
}

// The release key. android/keystore.properties is gitignored and names a
// keystore kept OUTSIDE the repo, backed up somewhere safe: storeFile (an
// absolute path), storePassword, keyAlias, keyPassword. Every update has to be
// signed with this same key or it will not install over the app already on a
// phone — and with allowBackup off, uninstalling to get round that loses the
// learner's progress. See DEPLOY.md.
def keyFile = rootProject.file('keystore.properties')
def keyProps = new Properties()
if (keyFile.exists()) keyFile.withInputStream { keyProps.load(it) }

android {
    namespace 'app.hangil.study'
    compileSdk 37

    defaultConfig {
        applicationId 'app.hangil.study'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        if (keyFile.exists()) {
            release {
                storeFile file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // Signed with ~/.android/debug.keystore. Fine for sideloading onto your
            // own phone; not a Play Store artifact. See DEPLOY.md.
            minifyEnabled false
        }
        release {
            // R8 is off for the same reason it is off in the Logger project: the only
            // thing Java does here is speak Korean, and the WebView finds those methods
            // by NAME through @JavascriptInterface. Rename one and the audio goes
            // silent with no error anywhere — a failure no test on this side would
            // catch, because there are no tests on this side.
            minifyEnabled false
            shrinkResources false
            if (keyFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
